[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-ollama"
version = "0.1.0"
description = "MCP server for one or more Ollama endpoints"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Peter Lemenkov", email = "lemenkov@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "ollama", "llm", "local-ai"]
dependencies = [
    "fastmcp>=4.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
mcp-ollama = "mcp_ollama.server:main"

[project.urls]
Homepage = "https://github.com/lemenkov/mcp-ollama"
Repository = "https://github.com/lemenkov/mcp-ollama"
Issues = "https://github.com/lemenkov/mcp-ollama/issues"

[tool.hatch.build.targets.wheel]
packages = ["mcp_ollama"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
